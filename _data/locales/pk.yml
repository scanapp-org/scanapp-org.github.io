h1: "پاکستان کے لیے مفت QR کوڈ سکینر آن لائن"

intro: |
  ScanApp ایک مفت QR کوڈ سکینر ہے جو براہ راست آپ کے ویب براؤزر میں کام کرتا ہے۔
  کسی ایپ کو ڈاؤن لوڈ کرنے کی ضرورت نہیں — صرف Chrome، Safari، یا کسی بھی جدید
  براؤزر میں scanapp.org کھولیں اور سکیننگ شروع کریں۔ Android، iPhone، PC، اور
  Mac سب پر کام کرتا ہے۔ تمام سکیننگ آپ کے ڈیوائس پر ہوتی ہے، اس لیے آپ کا ڈیٹا
  محفوظ ہے۔

features_title: "ScanApp کی خصوصیات"
features:
  - "100% مفت، کوئی سائن اپ نہیں"
  - "کوئی انسٹال نہیں — براؤزر میں چلتا ہے"
  - "کیمرے یا تصویر دونوں سے سکین کریں"
  - "JazzCash، Easypaisa، Raast، اور دیگر کے QR کوڈز پڑھتا ہے"
  - "پرائیویسی محفوظ — سکیننگ صرف ڈیوائس پر"

how_to:
  title: "ScanApp میں QR کوڈ کیسے سکین کریں"
  steps:
    - "اپنے براؤزر میں scanapp.org کھولیں (Chrome، Safari، یا کوئی بھی)"
    - "جب کیمرہ کی اجازت مانگی جائے تو 'Allow' دبائیں"
    - "کیمرے کو QR کوڈ کی طرف کریں، یا تصویر اپ لوڈ کریں"
    - "نتیجہ فوراً نظر آئے گا — لنک، ٹیکسٹ، یا ادائیگی کی معلومات"

