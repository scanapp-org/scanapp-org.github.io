faq:
  - q: "کیا ScanApp واقعی مفت ہے؟"
    a: "جی ہاں، 100% مفت۔ کوئی سائن اپ نہیں، کوئی اشتہار نہیں، کوئی in-app purchase نہیں۔ یہ ایک open-source پروجیکٹ ہے۔"
  - q: "کیا میرے Android فون پر کام کرے گا؟"
    a: "جی ہاں، تمام جدید Android فونز (Android 7 یا نیا) پر چلتا ہے۔ پرانے Android کے لیے تصویر اپ لوڈ کر کے سکین کر سکتے ہیں۔"
  - q: "iPhone پر کیسے استعمال کریں؟"
    a: "iPhone پر Safari براؤزر میں scanapp.org کھولیں (iOS 11+)۔ App Store سے کچھ انسٹال کرنے کی ضرورت نہیں۔"
  - q: "کیا میرا ڈیٹا محفوظ ہے؟"
    a: "جی ہاں۔ آپ کا سکین کیا گیا ڈیٹا کسی سرور پر نہیں بھیجا جاتا۔ تمام سکیننگ آپ کے ڈیوائس پر ہوتی ہے۔ ہم آپ کے QR کا content نہیں دیکھ سکتے۔"
  - q: "کیمرہ کام کیوں نہیں کر رہا؟"
    a: "براؤزر کو کیمرہ کی اجازت دیں۔ iPhone پر Safari استعمال کریں (Chrome iOS پر ابھی کیمرہ access نہیں دیتا)۔"
  - q: "کیا تصویر سے بھی QR سکین کر سکتے ہیں؟"
    a: "جی ہاں۔ اگر آپ کے پاس QR کوڈ کی تصویر ہے (screenshot یا WhatsApp سے)، تو اسے ScanApp پر اپ لوڈ کر کے سکین کر سکتے ہیں۔"

