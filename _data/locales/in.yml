faq:
  - q: "क्या ScanApp सच में मुफ़्त है?"
    a: "हाँ, 100% मुफ़्त। कोई signup नहीं, कोई ads नहीं, कोई in-app purchase नहीं। यह एक open-source project है।"
  - q: "क्या यह मेरे Android phone पर काम करेगा?"
    a: "हाँ, सभी modern Android phones (Android 7 या नया) पर चलता है। पुराने Android पर भी image upload करके scan कर सकते हैं।"
  - q: "iPhone पर कैसे चलाएँ?"
    a: "iPhone पर Safari browser में scanapp.org खोलें (iOS 11+)। App Store से कुछ install नहीं करना है।"
  - q: "क्या मेरा data safe है? Scanned QR कहीं save तो नहीं होता?"
    a: "नहीं, आपका scanned data किसी server पर नहीं भेजा जाता। सारी scanning आपके device पर local होती है। हम आपके QR का content देख ही नहीं सकते।"
  - q: "Camera काम क्यों नहीं कर रहा?"
    a: "Browser को camera की permission देना ज़रूरी है। iPhone में Safari ज़रूर use करें (Chrome iOS पर अभी camera access नहीं देता)।"
  - q: "क्या image से भी QR scan कर सकते हैं?"
    a: "हाँ। अगर आपके पास QR code की photo है (screenshot या WhatsApp से आई हो), तो उसे ScanApp पर upload करके scan कर सकते हैं।"

