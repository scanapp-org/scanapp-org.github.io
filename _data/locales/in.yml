h1: "मुफ़्त QR Code Scanner Online — भारत के लिए"

intro: |
  ScanApp एक मुफ़्त QR code scanner है जो सीधे आपके web browser में काम करता है।
  कोई app download करने की ज़रूरत नहीं — बस scanapp.org खोलें Chrome, Safari, या
  किसी भी modern browser में, और scanning शुरू कर दें। Android, iPhone, PC, Mac
  सब पर काम करता है। सारी scanning आपके device पर ही होती है, इसलिए आपका data
  सुरक्षित रहता है।

