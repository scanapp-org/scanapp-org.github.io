meta:
  title: "অনলাইন QR কোড স্ক্যানার বিনামূল্যে — ScanApp বাংলাদেশ"
  description: "আপনার ব্রাউজারেই বিনামূল্যে QR কোড স্ক্যানার। ক্যামেরা বা ছবি থেকে QR কোড স্ক্যান করুন। ডাউনলোড নেই, সাইন আপ নেই। bKash, Nagad, Rocket সাপোর্ট করে।"
  page_visible_description: "যেকোনো ব্রাউজারে কাজ করে এমন বিনামূল্যের QR কোড স্ক্যানার। ক্যামেরা দিয়ে স্ক্যান করুন বা QR কোডের ছবি আপলোড করুন। ইনস্টল নেই, সাইন আপ নেই।"

h1: "বাংলাদেশের জন্য বিনামূল্যে QR কোড স্ক্যানার অনলাইন"

intro: |
  ScanApp একটি বিনামূল্যের QR কোড স্ক্যানার যা সরাসরি আপনার ওয়েব ব্রাউজারে কাজ করে।
  কোনো অ্যাপ ডাউনলোড করার দরকার নেই — শুধু Chrome, Safari, বা যেকোনো আধুনিক ব্রাউজারে
  scanapp.org খুলুন এবং স্ক্যানিং শুরু করুন। Android, iPhone, PC, এবং Mac সব
  জায়গায় কাজ করে। সব স্ক্যানিং আপনার ডিভাইসেই হয়, তাই আপনার ডেটা নিরাপদ থাকে।

features_title: "ScanApp এর বৈশিষ্ট্য"
features:
  - "১০০% বিনামূল্যে, কোনো সাইন আপ নেই"
  - "ইনস্টল করার দরকার নেই — ব্রাউজারে চলে"
  - "ক্যামেরা বা ছবি দুটো দিয়েই স্ক্যান করুন"
  - "bKash, Nagad, Rocket-সহ সব পেমেন্ট অ্যাপের QR সাপোর্ট করে"
  - "প্রাইভেসি সুরক্ষিত — স্ক্যানিং শুধু ডিভাইসেই হয়"

how_to:
  title: "ScanApp দিয়ে QR কোড কীভাবে স্ক্যান করবেন"
