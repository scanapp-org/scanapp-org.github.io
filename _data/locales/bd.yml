faq:
  - q: "ScanApp কি সত্যিই বিনামূল্যে?"
    a: "হ্যাঁ, ১০০% বিনামূল্যে। কোনো সাইন আপ নেই, কোনো বিজ্ঞাপন নেই, কোনো in-app purchase নেই। এটি একটি open-source প্রজেক্ট।"
  - q: "আমার Android ফোনে কি কাজ করবে?"
    a: "হ্যাঁ, সব আধুনিক Android ফোনে (Android 7 বা নতুন) চলে। পুরাতন Android এ ছবি আপলোড করে স্ক্যান করতে পারবেন।"
  - q: "iPhone এ কীভাবে চালাবো?"
    a: "iPhone এ Safari ব্রাউজার দিয়ে scanapp.org খুলুন (iOS 11+)। App Store থেকে কিছু ইনস্টল করার দরকার নেই।"
  - q: "আমার ডেটা কি নিরাপদ?"
    a: "হ্যাঁ। আপনার স্ক্যান করা ডেটা কোনো সার্ভারে পাঠানো হয় না। সব স্ক্যানিং আপনার ডিভাইসেই হয়। আমরা আপনার QR এর content দেখতে পারি না।"
  - q: "ক্যামেরা কাজ করছে না কেন?"
    a: "ব্রাউজারকে ক্যামেরার অনুমতি দিতে হবে। iPhone এ Safari ব্যবহার করুন (Chrome iOS এ এখনো ক্যামেরা access দেয় না)।"
  - q: "ছবি থেকেও কি QR স্ক্যান করা যায়?"
    a: "হ্যাঁ। যদি আপনার কাছে QR কোডের ছবি থাকে (screenshot বা WhatsApp থেকে), সেটা ScanApp এ আপলোড করে স্ক্যান করতে পারবেন।"

