    - "ফলাফল সঙ্গে সঙ্গে দেখা যাবে — লিংক, টেক্সট, বা পেমেন্ট তথ্য"

payment_examples:
  title: "বাংলাদেশের জনপ্রিয় QR পেমেন্ট অ্যাপ"
  intro: "ScanApp বাংলাদেশের প্রধান সব পেমেন্ট অ্যাপের QR কোড পড়তে পারে:"
  apps:
    - name: "bKash"
      description: "bKash এর merchant QR এবং personal QR দুটোই স্ক্যান করা যায়। স্ক্যান করার পর bKash অ্যাপে গিয়ে পেমেন্ট সম্পন্ন করুন।"
    - name: "Nagad"
      description: "Nagad এর QR কোডগুলোও সম্পূর্ণ সাপোর্ট করে। দোকানে Nagad QR দিয়ে পেমেন্ট করতে পারবেন।"
    - name: "Rocket (Dutch-Bangla)"
      description: "Rocket এর QR কোড স্ক্যান করে দ্রুত পেমেন্ট করুন।"
    - name: "Upay, SureCash, MyCash"
      description: "অন্যান্য মোবাইল ফিনান্সিয়াল সার্ভিসের QR কোডও সাপোর্ট করে।"
    - name: "ব্যাংক QR (City Bank, BRAC, IBBL)"
      description: "বড় ব্যাংকগুলোর QR কোডও পড়া যায়।"

