faq:
  - q: "Adakah ScanApp benar-benar percuma?"
    a: "Ya, 100% percuma. Tiada pendaftaran, tiada iklan dalam aplikasi, tiada in-app purchases. Ini ialah projek sumber terbuka."
  - q: "Adakah berfungsi pada telefon Android saya?"
    a: "Ya, berfungsi pada semua telefon Android moden (Android 7 atau lebih baru) yang mempunyai kamera. Untuk Android lama, anda boleh muat naik imej kod QR."
  - q: "Bagaimana pada iPhone?"
    a: "Berfungsi pada iPhone dengan menggunakan Safari (iOS 11+). Tidak perlu install apa-apa dari App Store."
  - q: "Adakah data saya selamat?"
    a: "Ya. Data imbasan anda tidak dihantar ke mana-mana server. Semua pengimbasan dilakukan pada peranti anda sahaja. Kami tidak boleh melihat kandungan kod QR anda."
  - q: "Kenapa kamera saya tidak berfungsi?"
    a: "Pastikan pelayar diberi kebenaran untuk mengakses kamera. Pada iPhone, gunakan Safari (Chrome untuk iOS belum boleh mengakses kamera)."
  - q: "Boleh imbas dari imej juga?"
    a: "Ya. Jika anda mempunyai gambar kod QR (screenshot atau dari WhatsApp), anda boleh muat naik ke ScanApp untuk diimbas."

