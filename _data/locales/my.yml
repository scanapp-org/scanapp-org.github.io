h1: "Pengimbas Kod QR Percuma Online untuk Malaysia"

intro: |
  ScanApp ialah pengimbas kod QR percuma yang berfungsi terus dalam pelayar web
  anda. Tidak perlu muat turun apa-apa aplikasi — buka sahaja scanapp.org dalam
  Chrome, Safari, atau pelayar moden yang lain, dan anda boleh mula mengimbas.
  Berfungsi pada Android, iPhone, PC, dan Mac. Semua pengimbasan dilakukan pada
  peranti anda, jadi data anda selamat — tiada apa-apa dihantar ke server.

features_title: "Ciri-ciri ScanApp"
features:
  - "100% percuma, tiada pendaftaran"
  - "Tiada perlu install — berfungsi dalam pelayar"
  - "Imbas dengan kamera atau imej"
  - "Sokong DuitNow QR, Touch 'n Go, GrabPay, dan lain-lain"
  - "Privasi terjamin — pengimbasan pada peranti sahaja"

how_to:
  title: "Cara mengimbas kod QR dengan ScanApp"
  steps:
    - "Buka scanapp.org dalam pelayar anda (Chrome, Safari, atau lain-lain)"
    - "Tekan 'Allow' apabila diminta untuk akses kamera"
    - "Halakan kamera ke kod QR, atau muat naik imej jika ada"
    - "Keputusan akan dipaparkan serta-merta — pautan, teks, atau maklumat bayaran"

