h1: "Pemindai Kode QR Online Gratis untuk Indonesia"

intro: |
  ScanApp adalah pemindai kode QR gratis yang bekerja langsung di browser web
  Anda. Tidak perlu mengunduh aplikasi apa pun — cukup buka scanapp.org di
  Chrome, Safari, atau browser modern lainnya, lalu mulai memindai. Bekerja
  di Android, iPhone, PC, dan Mac. Semua pemindaian dilakukan di perangkat
  Anda, sehingga data Anda aman — tidak ada yang dikirim ke server.

features_title: "Fitur ScanApp"
features:
  - "100% gratis, tanpa pendaftaran"
  - "Tanpa install — berjalan di browser"
  - "Pindai dengan kamera atau gambar"
  - "Mendukung QRIS, GoPay, OVO, DANA, dan lainnya"
  - "Privasi terjaga — pemindaian hanya di perangkat Anda"

how_to:
  title: "Cara memindai kode QR dengan ScanApp"
  steps:
    - "Buka scanapp.org di browser Anda (Chrome, Safari, atau lainnya)"
    - "Tekan 'Allow' saat diminta izin kamera"
    - "Arahkan kamera ke kode QR, atau unggah gambar"
    - "Hasil akan muncul seketika — tautan, teks, atau info pembayaran"

payment_examples:
  title: "Aplikasi pembayaran QR populer di Indonesia"
  intro: "ScanApp dapat membaca kode QR dari semua aplikasi pembayaran utama di Indonesia:"
  apps:
    - name: "QRIS"
      description: "QRIS (Quick Response Code Indonesian Standard) adalah standar QR resmi Bank Indonesia. Semua kode QRIS dapat dipindai oleh ScanApp untuk pembayaran lintas-aplikasi."
    - name: "GoPay"
      description: "Pindai kode QR GoPay untuk pembayaran di merchant yang mendukung Gojek/GoPay."
    - name: "OVO"
      description: "Mendukung kode QR OVO untuk pembayaran di Grab dan merchant OVO lainnya."
    - name: "DANA"
      description: "Kode QR DANA juga dapat dipindai untuk pembayaran cepat."
    - name: "ShopeePay, LinkAja, Sakuku"
      description: "Semua dompet digital utama Indonesia didukung melalui standar QRIS."

