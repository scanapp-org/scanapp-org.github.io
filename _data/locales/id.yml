faq:
  - q: "Apakah ScanApp benar-benar gratis?"
    a: "Ya, 100% gratis. Tanpa pendaftaran, tanpa iklan dalam aplikasi, tanpa pembelian dalam aplikasi. Ini adalah proyek open-source."
  - q: "Apakah berfungsi di ponsel Android saya?"
    a: "Ya, berfungsi di semua ponsel Android modern (Android 7 atau lebih baru) yang memiliki kamera. Untuk Android lama, Anda dapat mengunggah gambar kode QR."
  - q: "Bagaimana dengan iPhone?"
    a: "Berfungsi di iPhone dengan menggunakan Safari (iOS 11+). Tidak perlu menginstal apa pun dari App Store."
  - q: "Apakah data saya aman?"
    a: "Ya. Data pemindaian Anda tidak dikirim ke server mana pun. Semua pemindaian dilakukan di perangkat Anda sendiri. Kami tidak dapat melihat isi kode QR Anda."
  - q: "Mengapa kamera saya tidak bekerja?"
    a: "Pastikan browser diberi izin untuk mengakses kamera. Pada iPhone, gunakan Safari (Chrome untuk iOS belum dapat mengakses kamera)."
  - q: "Bisakah memindai dari gambar?"
    a: "Bisa. Jika Anda memiliki foto kode QR (screenshot atau dari WhatsApp), Anda dapat mengunggahnya ke ScanApp untuk dipindai."

