  title: "Pemindai Kode QR Online Indonesia — Scan QR & Barcode Gratis"
  description: "Pemindai kode QR online gratis untuk Indonesia. Pindai QR dan barcode menggunakan kamera atau unggah gambar, foto, galeri, dan screenshot. Mendukung QRIS, GoPay, OVO, DANA tanpa unduh atau daftar."
