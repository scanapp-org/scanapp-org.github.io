# Crawler-visible SEO content (rendered into the sr-only block by _layouts/locale.html)
h1: "Libreng QR Code Scanner Online para sa Pilipinas"

intro: |
  Ang ScanApp ay libreng QR code scanner na direktang gumagana sa iyong web browser.
  Hindi mo na kailangan mag-download ng app — buksan lang ang scanapp.org sa Chrome,
  Safari, o anumang modern browser, at maaari ka nang mag-scan. Gumagana ito sa
  Android, iPhone, PC, at Mac. Lahat ng scanning ay nangyayari sa iyong device,
  kaya ligtas ang iyong data — walang nasi-send sa server.

