faq:
  - q: "Libre ba talaga ang ScanApp?"
    a: "Oo, 100% libre. Walang signup, walang ads sa loob, walang in-app purchases. Open-source rin ang proyekto."
  - q: "Gumagana ba sa Android phone ko?"
    a: "Oo, gumagana sa lahat ng modern Android phones (Android 7 o mas bago) na may camera. Para sa older Android, maaaring ma-upload na lang ang larawan ng QR code."
  - q: "Gumagana ba sa iPhone?"
    a: "Oo, gumagana sa iPhone gamit ang Safari (iOS 11+). Hindi mo kailangan mag-install ng app sa App Store."
  - q: "Ligtas ba? Naka-save ba ang scanned data?"
    a: "Hindi nase-save ang iyong scanned data sa anumang server. Lahat ng scanning ay nangyayari sa iyong device. Hindi rin ipinapadala sa amin ang nilalaman ng QR code."
  - q: "Bakit hindi gumagana ang camera ko?"
    a: "Tiyaking pinayagan mo ang browser na gamitin ang camera. Sa iPhone, kailangang Safari ang gamit (hindi Chrome) dahil ang ibang browsers ay hindi pa nakakakuha ng camera access sa iOS."
  - q: "Maaari ba akong mag-scan mula sa larawan?"
    a: "Oo. Kung may larawan ka na ng QR code (halimbawa, screenshot o pic mula sa Messenger), maaari mong i-upload sa ScanApp at babasahin nito ang code."

