<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="icon" sizes="144x144" href="/assets/svg/log_sq-144.jpg">
  
  <!-- Primary Meta Tags -->
  <title>{{ page.title | default: "QR Code Scanner - ScanApp" }}</title>
  <meta name="title" content="{{ page.meta_title | default: page.title | default: "QR Code Scanner - ScanApp" }}">
  <meta name="description" content="{{ page.meta_description | default: "Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!" }}">

  <script>
    window.scanappPageData = {
      title: {% if page.title %}"{{ page.title | escape }}"{% else %}null{% endif %},
      description: {% if page.page_visible_description %}"{{ page.page_visible_description | escape }}"{% else %}null{% endif %}
    };
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://scanapp.org/beta">
  <meta property="og:title" content="QR Code Scanner - ScanApp">
  <meta property="og:description" content="Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!">
  <meta property="og:image" content="https://scanapp.org/assets/svg/scanapp-logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://scanapp.org/beta">
  <meta property="twitter:title" content="QR Code Scanner - ScanApp">
  <meta property="twitter:description" content="Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!">
  <meta property="twitter:image" content="https://scanapp.org/assets/svg/scanapp-logo.png">
  
  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="manifest" href="/assets/manifest.json" />
  <link rel="apple-touch-icon" href="https://scanapp.org/assets/svg/scanapp-logo.png">

  <!-- Stylesheets -->
  <link rel="preload" href="/assets/css/scanapp-v2.css" as="style">
  <link rel="stylesheet" href="/assets/css/scanapp-v2.css">

  <!-- Scripts -->
  <link rel="preload" href="/assets/js/scanapp-v2.min.js" as="script">
  <script defer src="/assets/js/scanapp-v2.min.js"></script>
  
  <base target="_parent">

  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://www.google-analytics.com">
</head>
<body data-instant-allow-query-string data-instant-allow-external-links>
    <div> {{ content }} </div>
</body>

<!-- Global site tag (gtag.js) - Google Analytics -->
<script defer src="https://www.googletagmanager.com/gtag/js?id=G-2KZEP7DPYH"></script>
<script defer>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-2KZEP7DPYH');
</script>
</html>
