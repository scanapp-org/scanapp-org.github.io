<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="icon" type="image/svg+xml" href="/assets/images/svgs/logo.svg">
  
  <!-- Primary Meta Tags -->
  <title>{{ page.title | default: "QR Code Scanner - ScanApp" }}</title>
  <meta name="title" content="{{ page.meta_title | default: "QR Code Scanner - Scan QR Code with webcam or files" }}">
  <meta name="description" content="{{ page.meta_description | default: "Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!" }}">

  <script>
    window.scanappPageData = {
      title: {% if page.title %}"{{ page.title | escape }}"{% else %}null{% endif %},
      description: {% if page.page_visible_description %}"{{ page.page_visible_description | escape }}"{% else %}null{% endif %}
    };
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://scanapp.org/">
  <meta property="og:title" content="{{ page.meta_title | default: "QR Code Scanner - Scan QR Code with webcam or files" }}">
  <meta property="og:description" content="{{ page.meta_description | default: "Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!" }}">
  <meta property="og:image" content="https://scanapp.org/assets/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ScanApp - Free QR Code Scanner. Works in your browser, no install, no signup.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://scanapp.org/">
  <meta property="twitter:title" content="{{ page.meta_title | default: "QR Code Scanner - Scan QR Code with webcam or files" }}">
  <meta property="twitter:description" content="{{ page.meta_description | default: "Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!" }}">
  <meta property="twitter:image" content="https://scanapp.org/assets/og-card.png">
  <meta property="twitter:image:alt" content="ScanApp - Free QR Code Scanner. Works in your browser, no install, no signup.">
  
  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="manifest" href="/assets/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/images/svgs/logo.svg">

  <!-- Structured data: helps Google understand this is a free, web-based utility app.
       Eligible for SoftwareApplication/WebApplication rich-result enhancements. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ScanApp",
    "alternateName": "QR Code Scanner - ScanApp",
    "url": "https://scanapp.org/",
    "description": "{{ page.meta_description | default: "Use ScanApp to scan QR or different Bar Codes on your web browser using camera or images. Works for free on PC, Mac, Android, IOS without any sign up!" }}",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any (web-based: Windows, macOS, Android, iOS, Linux, ChromeOS)",
    "browserRequirements": "Requires JavaScript and camera access (optional for image-file scanning).",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "ScanApp",
      "url": "https://scanapp.org/",
      "logo": "https://scanapp.org/assets/og-card.png"
    },
    "featureList": [
      "Scan QR codes using device camera",
      "Scan QR codes and barcodes from image files",
      "Works on PC, Mac, Android, and iOS",
      "100% free, no signup required",
      "Scanning is done locally on the device"
    ]
  }
  </script>

  <!-- Screen-reader-only SEO fallback styling. Keeps crawler-visible content in the DOM
       without interfering with the JS-rendered app overlay (#scanapp-root is 100vw x 100vh). -->
  <style>
    .scanapp-seo-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #scanapp-root {
      background-color: #0a0a0c;
      color: #f3f4f6;
    }

    .scanapp-static-loader {
      align-items: center;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      gap: 16px;
      height: 100vh;
      height: 100dvh;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      width: 100vw;
    }

    .scanapp-static-spinner {
      animation: scanapp-static-spin 0.8s linear infinite;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      border-top-color: #10b981;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
      height: 44px;
      width: 44px;
    }

    .scanapp-static-loader .camera-loader-text {
      color: #f3f4f6;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes scanapp-static-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Stylesheets -->
  <link rel="preload" href="/assets/css/scanapp-v2.min.css" as="style">
  <link rel="stylesheet" href="/assets/css/scanapp-v2.min.css">

  <!-- Scripts -->
  <link rel="preload" href="/assets/js/scanapp-v2.min.js" as="script">
  <script defer src="/assets/js/scanapp-v2.min.js"></script>
  
  <base target="_parent">
  <link rel="canonical" href="https://scanapp.org"/>

  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://www.google-analytics.com">
</head>
<body data-instant-allow-query-string data-instant-allow-external-links>
    <div> {{ content }} </div>
</body>

<!-- Global site tag (gtag.js) - Google Analytics -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  window.loadScanAppAnalytics = function() {
    if (window.__scanAppAnalyticsLoaded) {
      return;
    }

    window.__scanAppAnalyticsLoaded = true;
    var analyticsScript = document.createElement('script');
    analyticsScript.async = true;
    analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-2KZEP7DPYH';
    document.head.appendChild(analyticsScript);
    gtag('js', new Date());
    gtag('config', 'G-2KZEP7DPYH');
  };

  var scheduleScanAppAnalytics = function() {
    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(window.loadScanAppAnalytics, { timeout: 3000 });
      return;
    }

    window.setTimeout(window.loadScanAppAnalytics, 3000);
  };

  if (document.readyState === 'complete') {
    scheduleScanAppAnalytics();
  } else {
    window.addEventListener('load', scheduleScanAppAnalytics, { once: true });
  }
</script>
</html>
